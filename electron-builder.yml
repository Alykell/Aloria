appId: fr.alykell.aloria
productName: Aloria
copyright: Copyright © 2026 Alykell
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
# Le mod Aloria HUD (construit par Gradle dans mod/) est livré à côté du launcher
extraResources:
  - from: mod/build/libs
    to: mods
    filter:
      - aloria-hud-*.jar
win:
  target: nsis
  icon: resources/icon.png
  artifactName: Aloria-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Aloria
  installerLanguages:
    - fr_FR
  language: '1036'
  # Garde les jeux, profils et comptes si on désinstalle
  deleteAppDataOnUninstall: false
# Les mises à jour sont publiées dans les Releases GitHub du dépôt
publish:
  provider: github
  owner: Alykell
  repo: Aloria
  releaseType: release
