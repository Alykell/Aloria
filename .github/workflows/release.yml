# Publie une nouvelle version d'Aloria quand un tag vX.Y.Z est poussé :
# construit l'installeur Windows et le dépose dans les Releases GitHub,
# où le launcher va chercher ses mises à jour automatiques.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Vérifier que le tag correspond à package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Le tag $GITHUB_REF_NAME ne correspond pas à la version $version de package.json"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Un jar par version de Minecraft (préprocesseur dans mod/build.gradle, Fabric API choisie selon la version).
      # « shell: cmd » : PowerShell couperait les arguments comme -Pminecraft_version=26.2 au niveau du point
      - name: Construire le mod Aloria HUD (toutes les versions de mod/build.gradle)
        working-directory: mod
        shell: cmd
        run: |
          for %%v in (26.3 26.2 1.21.11 1.21.8 1.21.4 1.21.1 1.20.4 1.20.1) do (
            call gradlew.bat build --no-daemon -Pminecraft_version=%%v || exit /b 1
          )

      # Mod 1.8.9 : projet séparé (Legacy Fabric, Java 8)
      - name: Construire le mod Aloria HUD (1.8.9)
        working-directory: mod-legacy
        shell: cmd
        run: gradlew.bat build --no-daemon

      # 1.8.9 sous Forge : le code de mod-legacy converti aux noms MCP (a besoin du cache Gradle de mod-legacy)
      - name: Construire le mod Aloria HUD (1.8.9 Forge)
        working-directory: mod-forge
        shell: cmd
        run: gradlew.bat build --no-daemon

      - run: npm ci

      - run: npm run typecheck

      # Une seule release (brouillon) créée avant l'envoi des fichiers, publiée une fois complète
      - name: Créer le brouillon de release
        shell: bash
        # Une release déjà présente pour ce tag (publication ratée ou incomplète) est remplacée
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && gh release delete "$GITHUB_REF_NAME" --yes
          gh release create "$GITHUB_REF_NAME" --draft --title "Aloria ${GITHUB_REF_NAME#v}" --notes "Mise à jour d'Aloria ${GITHUB_REF_NAME#v}.

          Téléchargement : https://alykell.github.io/Aloria/

          Installeur non signé : si Windows affiche un avertissement, « Informations complémentaires » puis « Exécuter quand même » (détails : https://alykell.github.io/Aloria/#faq). Construit par GitHub Actions à partir du code public. Confidentialité : https://alykell.github.io/Aloria/confidentialite.html"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et envoyer les fichiers
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Mise à jour légère : code du launcher + jars, remplacés par le launcher lui-même (pas d'installeur à lancer)
      - name: Envoyer la mise à jour légère et l'installeur à nom fixe
        shell: bash
        run: |
          node scripts/light-update.mjs
          gh release upload "$GITHUB_REF_NAME" dist/light/* --clobber
          # Copie de l'installeur sous un nom fixe : le site la télécharge via …/releases/latest/download/Aloria-Setup.exe
          cp "dist/Aloria-Setup-${GITHUB_REF_NAME#v}.exe" dist/Aloria-Setup.exe
          gh release upload "$GITHUB_REF_NAME" dist/Aloria-Setup.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier la release
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Annonce dans #annonces du Discord d'Aloria (webhook dans les secrets du dépôt ; étape ignorée sans lui).
      # Le texte vient du message du commit de version : « vX.Y.Z : nouveautés, séparées par des virgules ».
      - name: Annoncer la mise à jour sur Discord
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -z "$DISCORD_WEBHOOK_URL" ] && { echo "Pas de webhook Discord : annonce ignorée"; exit 0; }
          git log -1 --format=%s > subject.txt
          node -e '
            const fs = require("fs")
            const version = process.env.GITHUB_REF_NAME.replace(/^v/, "")
            const subject = fs.readFileSync("subject.txt", "utf8").trim()
            const news = subject.replace(/^v[\d.]+\s*:\s*/, "").split(/,\s*/).filter(Boolean)
            const notifs = "1557731017861636116"
            fs.writeFileSync("discord.json", JSON.stringify({
              content: `<@&${notifs}>`,
              allowed_mentions: { roles: [notifs] },
              embeds: [{
                title: `🚀 Aloria ${version}`,
                url: `https://github.com/Alykell/Aloria/releases/tag/v${version}`,
                color: 0x2bb5d8,
                description: news.map((n) => `• ${n.charAt(0).toUpperCase()}${n.slice(1)}`).join("\n") +
                  "\n\nLe launcher se met à jour tout seul. Nouveau ? [Télécharger Aloria](https://alykell.github.io/Aloria/)"
              }]
            }))
          '
          curl -sf -H "Content-Type: application/json" -d @discord.json "$DISCORD_WEBHOOK_URL"
