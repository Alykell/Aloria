# Publie une nouvelle version d'Aloria quand un tag vX.Y.Z est poussé :
# construit l'installeur Windows et le dépose dans les Releases GitHub,
# où le launcher va chercher ses mises à jour automatiques.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Vérifier que le tag correspond à package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Le tag $GITHUB_REF_NAME ne correspond pas à la version $version de package.json"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Un jar par version de Minecraft (les classes de rendu diffèrent entre 26.2 et 26.3).
      # « shell: cmd » : PowerShell couperait les arguments comme -Pminecraft_version=26.2 au niveau du point
      - name: Construire le mod Aloria HUD (Minecraft 26.3)
        working-directory: mod
        shell: cmd
        run: gradlew.bat build --no-daemon

      - name: Construire le mod Aloria HUD (Minecraft 26.2)
        working-directory: mod
        shell: cmd
        run: gradlew.bat build --no-daemon -Pminecraft_version=26.2 -Pfabric_api_version=0.161.0+26.2

      - run: npm ci

      - run: npm run typecheck

      # Une seule release (brouillon) créée avant l'envoi des fichiers, publiée une fois complète
      - name: Créer le brouillon de release
        shell: bash
        # Une release déjà présente pour ce tag (publication ratée ou incomplète) est remplacée
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && gh release delete "$GITHUB_REF_NAME" --yes
          gh release create "$GITHUB_REF_NAME" --draft --title "Aloria ${GITHUB_REF_NAME#v}" --notes "Mise à jour d'Aloria ${GITHUB_REF_NAME#v}."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et envoyer les fichiers
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier la release
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
