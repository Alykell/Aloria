# Publie une nouvelle version d'Aloria quand un tag vX.Y.Z est poussé :
# construit l'installeur Windows et le dépose dans les Releases GitHub,
# où le launcher va chercher ses mises à jour automatiques.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Vérifier que le tag correspond à package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Le tag $GITHUB_REF_NAME ne correspond pas à la version $version de package.json"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Un jar par version de Minecraft (les classes de rendu diffèrent entre 26.2 et 26.3)
      - name: Construire le mod Aloria HUD (Minecraft 26.3)
        working-directory: mod
        run: ./gradlew.bat build --no-daemon

      - name: Construire le mod Aloria HUD (Minecraft 26.2)
        working-directory: mod
        run: ./gradlew.bat build --no-daemon -Pminecraft_version=26.2 -Pfabric_api_version=0.161.0+26.2

      - run: npm ci

      - run: npm run typecheck

      - name: Construire et publier
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
