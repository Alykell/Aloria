// Aloria HUD pour Minecraft 1.8.9 (Legacy Fabric) : Java 8, noms Yarn, pas de Fabric API (tout passe par des mixins).
// Les réglages (config/aloria-hud.json, ou le fichier commun du launcher) sont les mêmes que ceux du mod moderne.
plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'legacy-looming' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"

base {
	archivesName = 'aloria-hud'
}

// Classes de réglages partagées avec le mod moderne (simples et compatibles Java 8) : même format de fichier
def sharedConfig = tasks.register('sharedConfig', Sync) {
	from('../mod/src/main/java') {
		include 'fr/alykell/aloria/hud/config/ModuleSettings.java'
		include 'fr/alykell/aloria/hud/config/GlobalSettings.java'
		include 'fr/alykell/aloria/hud/config/VisualSettings.java'
	}
	into layout.buildDirectory.dir('shared-src')
}
sourceSets.main.java.srcDir(sharedConfig)

// Mêmes modules que le mod moderne (l'identifiant est la clé des réglages dans le JSON commun), chacun nommé dans les deux langues
def checkModuleIds = tasks.register('checkModuleIds') {
	def modern = fileTree('../mod/src/main/java/fr/alykell/aloria/hud/module')
	def legacy = fileTree('src/main/java/fr/alykell/aloria/hud/module')
	def lang = fileTree('../mod/src/main/resources/assets/aloriahud/lang') { include '*.json' }
	inputs.files(modern, legacy, lang)
	doLast {
		def ids = { files -> files.collectMany { f -> (f.getText('UTF-8') =~ /super\("([a-z_]+)"\)/).collect { it[1] } } as TreeSet }
		def m = ids(modern.files), l = ids(legacy.files)
		def problems = ((m + l) as TreeSet).findAll { !(it in m) || !(it in l) }
			.collect { "  ${it} : ${it in m ? 'absent du mod 1.8.9' : 'absent du mod moderne'}" }
		lang.files.each { f ->
			def keys = new groovy.json.JsonSlurper().parse(f, 'UTF-8').keySet()
			((m + l) as TreeSet).findAll { !keys.contains("aloriahud.module.${it}".toString()) }.each { problems << "  ${it} : pas de nom dans ${f.name}" }
		}
		if (problems) throw new GradleException("Modules différents entre mod/ et mod-legacy/ :\n" + problems.join('\n'))
	}
}
tasks.named('compileJava') { dependsOn checkModuleIds }

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings(legacy.yarn(project.minecraft_version, project.yarn_build))
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// Traductions : les fichiers .lang de la 1.8.9 reçoivent celles du mod moderne (mêmes clés, une seule source)
def modernLang = file('../mod/src/main/resources/assets/aloriahud/lang')
processResources {
	inputs.dir(modernLang)
	doLast {
		[en_US: 'en_us', fr_FR: 'fr_fr'].each { legacy, modern ->
			def entries = new groovy.json.JsonSlurper().parse(new File(modernLang, "${modern}.json"), 'UTF-8')
				.findAll { k, v -> k.startsWith('aloriahud.') }
			def out = new File(destinationDir, "assets/aloriahud/lang/${legacy}.lang")
			def start = out.exists() && !out.getText('UTF-8').endsWith('\n') ? '\n' : ''
			out.append(start + entries.collect { k, v -> "${k}=${v}" }.join('\n') + '\n', 'UTF-8')
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 8
}

java {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}
